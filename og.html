<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>OG card — 360 Soccer Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&amp;family=Spline+Sans+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(90vw 70vh at 78% -10%, rgba(227,27,35,.6), transparent 65%),
      radial-gradient(70vw 50vh at 15% 115%, rgba(227,27,35,.14), transparent 60%),
      #090909;
    color: #ffffff;
    font-family: "Big Shoulders Display", sans-serif;
    position: relative;
  }
  .card {
    position: absolute; inset: 0;
    padding: 6vh 6vw;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .wordmark {
    font-size: 5.2vh; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    display: flex; align-items: center;
  }
  .wordmark .emblem { width: 7vh; height: 7vh; margin-right: 1.6vw; flex: none; }
  .wordmark .number { color: #ed1c24; margin-right: .18em; }
  .wordmark .name { color: #ffffff; }
  .wordmark small {
    font-family: "Spline Sans Mono", monospace; font-size: 1.9vh; letter-spacing: .3em;
    color: #bdbdbd; margin-left: 2.2vw; font-weight: 500;
  }
  h1 {
    font-size: 15.5vh; line-height: .92; font-weight: 800; text-transform: uppercase;
    letter-spacing: .01em; max-width: 62vw;
  }
  h1 .accent { color: #ed1c24; }
  .foot {
    font-family: "Spline Sans Mono", monospace; font-size: 2.2vh; letter-spacing: .18em;
    text-transform: uppercase; color: #bdbdbd; display: flex; align-items: center; gap: 1.4vw;
  }
  .foot::before { content: ""; width: 3vw; height: 2px; background: #ed1c24; }
  /* pitch motif right side */
  svg.pitch {
    position: absolute; right: 5vw; top: 50%; transform: translateY(-50%);
    height: 76vh; opacity: .9;
  }
</style>
</head>
<body>
  <svg class="pitch" viewBox="0 0 340 460" xmlns="http://www.w3.org/2000/svg">
    <rect x="4" y="4" width="332" height="452" rx="8" fill="#151515" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="4" y1="230" x2="336" y2="230" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
    <circle cx="170" cy="230" r="38" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="92" y="4" width="156" height="58" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="92" y="398" width="156" height="58" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
    <circle cx="170" cy="230" r="108" fill="#ed1c24" opacity="0.08"/>
    <circle cx="170" cy="230" r="108" fill="none" stroke="#ed1c24" stroke-width="4" stroke-dasharray="210 26"/>
    <text x="170" y="250" fill="#ffffff" font-family="'Big Shoulders Display',sans-serif" font-size="72" font-style="italic" font-weight="800" text-anchor="middle">360</text>
  </svg>
  <div class="card">
    <div class="wordmark"><img class="emblem" src="logo.svg" alt=""><span class="number">360</span><span class="name">Soccer Training</span><small>Complete Player Development</small></div>
    <h1>Train the <span class="accent">whole</span> player. Own every angle.</h1>
    <div class="foot">Private training · Film analysis · Alexandria, VA</div>
  </div>
</body>
</html>
