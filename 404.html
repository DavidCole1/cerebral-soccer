<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | 360 Soccer Training</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&amp;family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=Spline+Sans+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .notfound {
      min-height: calc(100vh - 72px);
      display: flex;
      align-items: center;
    }
    .notfound-inner { max-width: 560px; }
    .notfound h1 { font-size: clamp(3rem, 9vw, 5.5rem); }
    .notfound .whistle {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cone);
      margin-bottom: 16px;
      display: block;
    }
  </style>
</head>
<body style="background: var(--night);">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container nav-bar">
      <a class="wordmark" href="/index.html" aria-label="360 Soccer Training home">
        <img class="wordmark-logo" src="/logo.svg" alt="" width="30" height="30">
        <span class="brand-number">360&nbsp;</span><span class="brand-name">Soccer Training</span>
        <small>Complete Player Development</small>
      </a>
    </div>
  </header>

  <main id="main">
    <section class="notfound on-night">
      <div class="container">
        <div class="notfound-inner">
          <span class="whistle">404 · Whistle blown</span>
          <h1>Out of <span style="color: var(--cone);">bounds</span>.</h1>
          <p class="lede" style="margin: 18px 0 30px;">That page is out of play. It may have moved or no longer exists. Let's restart from the touchline.</p>
          <div class="hero-ctas">
            <a class="btn btn-cone" href="/index.html">Back to the pitch</a>
            <a class="btn btn-ghost" href="/film-room.html">Visit the Film Room</a>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
